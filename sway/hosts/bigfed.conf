# bigfed's layer, included by ../config after every setting there: only what
# would be wrong on fedxps belongs here. Created empty 2026-09-30: the machine
# keeps no idle timer either (Caffeine posture, confirmed that day), and its
# power button is handled in the shared file. The variables set in the shared
# file ($mod, $samsung, $msi) are visible here.

# Screens off, on the way out of the chair: lock, then power both monitors
# down a second after the seat falls quiet, and bring them back at the first
# key or mouse movement, the machine awake and reachable throughout. A session
# op, so the Ctrl tier, b beside l (lock), the chord of the GNOME shortcut
# here. bigfed's alone, as that shortcut is: the laptop's way out of the chair
# is its lid. The mechanism, and why it is a one-shot swayidle rather than a
# second timer, is in ~/bin/screens-off's header; by path, since a sway
# session's PATH lacks ~/bin (TODO.md item 29). 2026-10-03.
bindsym --no-repeat $mod+Ctrl+b exec ~/bin/screens-off
