<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<!--
  09-texlive-fonts.conf: expose TeX Live's fonts to fontconfig.

  TeX Live ships ~1,500 font families that kpathsea can find but fontconfig
  cannot, so they are invisible to every GUI application. This adds them.
  Nothing is copied; fontconfig reads them where TeX Live already put them.

  THE YEAR BELOW IS PINNED, and it is the only line here that needs
  maintenance. After `tl-newyear switch 2027` these directories still exist,
  since the old release is kept as a fallback, but once it is deleted
  fontconfig ignores the missing <dir> silently and the fonts disappear from
  application menus. Bump the year here then. Unlike
  bash/.bashrc.d/20-path.sh, fontconfig has no way to discover it.

  Type1 is deliberately absent, though TeX Live's own texlive-fontconfig.conf
  includes it. Those 7,628 .pfb files carry TeX's OT1/T1 encodings rather than
  Unicode, so a GUI application renders the wrong glyph for most of the
  keyboard.
-->

<fontconfig>

  <dir>/usr/local/texlive/2026/texmf-dist/fonts/opentype</dir>
  <dir>/usr/local/texlive/2026/texmf-dist/fonts/truetype</dir>

  <selectfont>

    <!-- (1) Families Fedora already packages. Without these, each such
         family is listed twice and may resolve to the TeX Live copy,
         which is same version or older (Fedora's DejaVu is newer). -->
    <rejectfont>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/adobe/sourcecodepro/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/gnome/cantarell/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/courierten/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/fontawesome/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/fontawesome6/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/lm/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/lm-math/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/mnsymbol/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/montserrat/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/rit-fonts/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/stix/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/stix2-otf/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/SIL/jetbrainsmono-otf/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/aajohan/comfortaa/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/ascender/droid/droidsans/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/ascender/opensans/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/google/carlito/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/google/noto/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/google/noto-emoji/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/huerta/caladea/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/public/dejavu/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/public/rit-fonts/*</glob>
    </rejectfont>

    <!-- (2) Fonts with no language coverage: math, chant, chess, icons,
         dozenal digits, printer's flowers. Usable only from TeX, and
         otherwise 246 junk entries in every font menu. Delete this
         block to get them back. -->
    <rejectfont>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/iginomarini/imfellenglish/FeFlow*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/academicons/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/ccicons/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/context/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/dantelogo/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/drm/drmdoz*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/drm/drmfigs*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/drm/drmgrk*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/drm/drminf*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/ebgaramond/EBGaramond-Initials.otf*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/fandol/FandolBraille-*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/fdsymbol/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/fontawesome/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/fourier/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/libertinus-fonts/LibertinusSerifInitials-Regular.otf*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/lilyglyphs/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/luapstricks/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/mdsymbol/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/metsymb/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/mnsymbol/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/newpx/npxsups-*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/newtx/ntxsups-*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/phaistos/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/simpleicons/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/skaknew/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/svrsymbols/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/opentype/public/yinit-otf/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/public/academicons/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/public/belleek/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/public/emo/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/public/fonetika/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/public/fontmfizz/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/public/gregoriotex/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/public/hamnosys/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/public/marvosym/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/public/mpchess/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/public/mystyletau/*</glob>
      <glob>/usr/local/texlive/2026/texmf-dist/fonts/truetype/public/typicons/*</glob>
    </rejectfont>

  </selectfont>

</fontconfig>
