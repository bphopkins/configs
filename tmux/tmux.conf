# tmux configuration.
#
# Added 2026-09-12. This package has no CLAUDE.md: the whole of it is below,
# and the index in configs/CLAUDE.md points here.
#
# Why ~/.config/tmux and not ~/.tmux.conf: tmux(1) FILES lists ~/.tmux.conf,
# then $XDG_CONFIG_HOME/tmux/tmux.conf, then ~/.config/tmux/tmux.conf. The XDG
# home is a documented default rather than a fallback, and it matches the git,
# ghostty and mako packages, so the stow target is ~/.config/tmux.


### Status bar

# The desktop accent, matching sway exactly. sway/config sets
#
#   set $accent #0088FF
#
# and gives it to client.focused, so the bar and the window border drawn
# around it are now one colour. That makes this the second shared colour in
# the desktop, alongside $urgent (#d08770), which already spans sway, waybar,
# mako and swaylock. Same rule as that one: it changes in every config or in
# none. If this moves, move sway/config with it.
#
# Replaces tmux's stock bg=green,fg=black. fg=black is restated rather than
# left off -- a style string replaces the option wholesale, so `bg=#0088FF`
# alone would drop the foreground to the terminal default. Black is also the
# better reading: 5.97:1 against #0088FF, where white gives 3.52:1.
set -g status-style "bg=#0088FF,fg=black"

# One line does the whole bar. status-left-style, status-right-style,
# window-status-style, window-status-current-style and window-status-last-style
# are all `default` out of the box, so each inherits the above, and the active
# window goes on being marked by its `*` flag rather than by colour. Read off
# `tmux show -g` and `tmux show -gw` on 3.7c, 2026-09-12.

# Declare 24-bit colour for the terminal WezTerm reports as. Measured
# 2026-09-12 with a pty probe, reading the bytes tmux actually emits:
#
#   Ghostty  (TERM=xterm-ghostty)   terminfo carries Tc and setrgbb, so tmux
#                                   emits 48;2;0;136;255 unconditionally.
#   WezTerm  (TERM=xterm-256color)  terminfo carries neither, so 24-bit output
#                                   rides entirely on COLORTERM=truecolor.
#
# What the line is worth at this particular colour: little. With COLORTERM
# absent tmux falls back to the nearest palette entry, colour 33 = #0087FF,
# one step of green from #0088FF and invisible. It is kept for correctness
# rather than for rescue -- it makes the colour a declaration instead of a
# dependence on an environment variable, and it keeps the next colour change
# safe. At the #1E90FF this file briefly used, the same fallback landed on
# #0087FF too, which was a visible miss.
set -as terminal-features ",xterm-256color:RGB"


### Deliberate omissions
#
# Recorded so they are not mistaken for oversights and "fixed" later:
#
# * pane-active-border-style is still green -- it defaults to
#   `#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=green}}`, which
#   is a pane border rather than the bar, and shows only with a split open.
#   Left alone until splits are actually in use.
#
# * No prefix rebinding, no mouse setting, no copy-mode keys. The bar colour
#   came first on purpose; the rest follows from use.
