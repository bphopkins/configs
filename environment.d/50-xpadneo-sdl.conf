# Steam and the Xbox Elite Series 2 on bigfed (2026-08-06). The pad is bound to
# xpadneo (dkms, built from ~/src/xpadneo), and Steam's own HIDAPI joystick
# driver cannot speak to an xpadneo-bound pad: Steam showed the controller and
# registered zero inputs until this hint sent SDL to the kernel's driver
# instead. Read by systemd --user at manager start, so it takes effect per
# graphical login. First thing to check if the pad "connects but does nothing".
#
# Packaged 2026-09-23 for both machines. On fedxps it is inert: no Steam, no
# pad, and SDL consults the hint only when a program opens a joystick. If a pad
# is ever used there, SDL drives it through the kernel driver, as here.
SDL_JOYSTICK_HIDAPI=0
