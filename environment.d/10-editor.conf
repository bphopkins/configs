# Read by systemd --user at manager start (and on daemon-reload), so it reaches
# the user manager and everything the session spawns -- unlike
# ~/.bashrc.d/10-env.sh, which runs for interactive shells and, since
# 2026-09-23, for the login shell GDM starts. The two overlap on purpose:
# constants are safe to state twice (org/machines/environment.md, section 5),
# and this file alone covers units started before the login shell's
# environment is uploaded, and a user manager started by a non-graphical login.
#
# Added 2026-09-21 on bigfed, packaged 2026-09-23 (configs/environment.d, stowed
# to ~/.config/environment.d on both machines). Without it the session took
# EDITOR from /etc/profile.d/nano-default-editor.sh, whose guard fires precisely
# because nothing else had set it: measured `systemctl --user show-environment`
# giving EDITOR=/usr/bin/nano while an interactive shell gave nvim. Any GUI app
# honouring $EDITOR opened nano. Confirmed fixed at a fresh login, 2026-09-22.
#
# A bare name is safe here: nvim is /usr/bin/nvim from the neovim rpm, on the
# session PATH already.
#
# Scope: constants only. environment.d sets variables from constants and does
# nothing else, so PATH is not set here -- 20-path.sh needs discovery (the TeX
# Live year) and stays PATH's one author; the session gets its output through
# ~/.bash_profile instead. A PATH drop-in was declined 2026-07-26 and again
# 2026-09-23 (configs/DECISIONS.md). tests/env/run.sh pins both halves.
EDITOR=nvim
VISUAL=nvim
